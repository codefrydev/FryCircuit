<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FryCircuit Studio - Real-Time SPICE Circuit Simulation</title>
    <base href="/FryCircuit/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="stylesheet" href="./app.css" />
</head>
<body>
    <div id="splash">
        <div class="splash-logo">
            <img src="./favicon.svg" class="splash-logo-img" alt="FryCircuit Logo" />
            <div>
                <div class="splash-title">FryCircuit Studio</div>
                <div class="splash-subtitle">Real-Time SPICE MNA Simulation & Schematic Capture</div>
            </div>
        </div>
        <div class="splash-spinner"></div>
        <div class="splash-status" id="splash-status">Initializing WebAssembly Runtime...</div>
    </div>

    <div id="out"></div>

    <script>
        // Dismiss splash when Avalonia canvas attaches to #out
        const outDiv = document.getElementById('out');
        const splash = document.getElementById('splash');
        const observer = new MutationObserver((mutations, obs) => {
            if (outDiv && outDiv.children.length > 0) {
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 450);
                }
                obs.disconnect();
            }
        });
        if (outDiv) {
            observer.observe(outDiv, { childList: true, subtree: true });
        }
    </script>
    <script type="module" src="./main.js"></script>
</body>
</html>
